spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # V4: 1250.00 is not an integer number of kurus, so it is a bad request, not a rounding job.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # A retry inside the producer must not become a second copy on the broker. The only
        # duplication the consumer is asked to absorb is the relay republishing what it could
        # not mark, which is a duplicate the consumer can recognise by event id.
        enable.idempotence: true

ledger:
  outbox:
    relay:
      enabled: true
      interval-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health
