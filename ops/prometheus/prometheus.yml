# The application is not a compose service: it runs on the host so it can be restarted, debugged
# and profiled without a rebuild. Everything that observes it runs here instead.
#
# Port 8081, not 8080. The ledger API answers on loopback only, because it moves money and has no
# authentication; its management connector is the half that is reachable from here, and it serves
# two read-only endpoints.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
