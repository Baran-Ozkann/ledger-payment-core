services:
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    # Bound to loopback, like every published port in this file. Nothing here is hardened for a
    # network to reach: the database trusts a password of "ledger" and Grafana lets an anonymous
    # visitor in as Admin. Without the 127.0.0.1 prefix Docker publishes on 0.0.0.0 and on [::],
    # so a laptop on a cafe network is offering all of it to the room.
    #
    # 5433, not 5432. A machine with a native PostgreSQL already has 5432, and phase 5 moved this
    # container off it after finding that a run pointed at the wrong instance produces numbers that
    # look entirely reasonable and mean nothing. The ledger service does not use this port at all -
    # it reaches the database by service name - so this is for psql and the load harness.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the unprivileged role the application connects as, before the application first
      # connects. Runs only on an empty data directory, which is when it is needed.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    security_opt:
      - no-new-privileges:true
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because a broker can advertise only one address per listener and the
      # two kinds of client resolve different ones. HOST is for a process outside compose - the
      # test suite, the load harness - and advertises the published loopback port. DOCKER is for
      # the ledger service, which reaches the broker by its service name.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ledger-local-cluster-0001
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Traces arrive over OTLP, from the ledger service on this network or from an application run
  # on the host against the published 4318.
  tempo:
    image: grafana/tempo:2.8.1
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/tempo.yml"]
    configs:
      - source: tempo
        target: /etc/tempo.yml
    ports:
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/var/tempo

  # The ledger itself. Built from this checkout, so the quick start needs no JDK and no Maven on
  # the host; `docker compose up --build` is the whole of it.
  ledger:
    build:
      context: .
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: compose
    # The API only, and on loopback: it moves money and has no authentication. The management
    # connector stays unpublished - Prometheus reaches it across this network by service name.
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Runs once and exits. It creates and funds the two accounts the README's single curl transfers
  # between, through the API like any other client, and prints that curl with their ids filled in.
  demo-accounts:
    image: curlimages/curl:8.14.1
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "/seed.sh"]
    volumes:
      - ./ops/demo/seed.sh:/seed.sh:ro
    restart: "no"
    depends_on:
      ledger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # A load ramp runs for a quarter of an hour and gets read afterwards, sometimes days
      # afterwards. At 24h the first steps of a run roll off before anyone plots them.
      - --storage.tsdb.retention.time=30d
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # Named automatically on Docker Desktop, but not on a Linux daemon, and the scrape target is
      # the host either way.
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.0.2
    security_opt:
      - no-new-privileges:true
    environment:
      # A login screen between the reviewer and the dashboard would buy nothing and cost the
      # first ten minutes of the quick start. What makes that true rather than merely convenient
      # is the loopback binding below: anonymous Admin is only safe while the only thing that can
      # reach port 3000 is this machine. Publish this port more widely and this has to change.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

# Read-only single files, so a bind mount of a whole directory is not needed to deliver one config.
configs:
  tempo:
    file: ./ops/tempo/tempo.yml
  prometheus:
    file: ./ops/prometheus/prometheus.yml

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  prometheus-data:
  grafana-data:
