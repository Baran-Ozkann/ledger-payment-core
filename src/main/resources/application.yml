spring:
  application:
    name: ledger
  datasource:
    # 127.0.0.1, not localhost. Every published port binds IPv4 loopback only, and on Windows
    # localhost resolves to ::1 first, so a name here costs a failed connection and its two
    # second timeout on every attempt. Measured: 2049 ms per request against 14 ms.
    #
    # 5433 is where compose publishes the container, and it is deliberately not 5432: a machine with
    # its own PostgreSQL answers there, and a run pointed at the wrong instance looks entirely
    # reasonable and means nothing. The compose profile ignores this line and uses the service name.
    url: jdbc:postgresql://127.0.0.1:5433/ledger
    # Not the owner, and not a superuser. It holds exactly the verbs the code issues and cannot
    # UPDATE or DELETE a ledger entry, which is the second of I5's two defenses; disabling the
    # trigger that is the first one needs table ownership it does not have. See V12.
    username: ledger_app
    password: ledger_app
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations need DDL and the application does not, so they run as the owner and the
    # application never holds those rights at all. This is the whole point of the split: a bug
    # that reaches JdbcClient with the wrong SQL cannot rewrite history, because the connection
    # it would use is not allowed to.
    user: ledger
    password: ledger
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # V4: 1250.00 is not an integer number of kurus, so it is a bad request, not a rounding job.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    template:
      # Without this the producer never injects traceparent and the consumer starts a trace of its
      # own, so a slow request and the event it caused end up in two unrelated traces.
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # A retry inside the producer must not become a second copy on the broker. The only
        # duplication the consumer is asked to absorb is the relay republishing what it could
        # not mark, which is a duplicate the consumer can recognise by event id.
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A new group reads the topic from the beginning: the projection is derived, so the only
      # way it can be right is by seeing every event there has ever been.
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # The other half of the same switch: the container extracts traceparent off the record and
      # runs the listener inside the trace that wrote it.
      observation-enabled: true
      # The offset moves only after the listener method has returned, which is after the dedup row
      # and the projection write have committed together. Committing earlier would lose the event.
      ack-mode: record

ledger:
  outbox:
    relay:
      enabled: true
      interval-ms: 200
  retention:
    # Daily and an hour apart, so the two never compete for the same connections.
    idempotency-keys-cron: "0 15 3 * * *"
    outbox-cron: "0 15 4 * * *"
  concurrency:
    # ADR-004, the shipped half. Two transfers over the same pair of accounts ask for the same rows
    # in the same order, so one queues behind the other and neither is ever aborted - which is what
    # lets a single attempt be the whole story. The serializable profile is the measured alternative.
    ordered-locking: true
    max-attempts: 1
  recon:
    # Five minutes. Drift is not urgent to the minute, and the scan is the one query in the system
    # that touches every account, so it is deliberately infrequent.
    interval-ms: 300000

server:
  # The ledger moves money and has no authentication, so it answers on loopback only. Reaching it
  # from elsewhere is a deliberate act - an SSH tunnel, or the compose network once the
  # application becomes a service there - rather than the default.
  address: 127.0.0.1

management:
  server:
    # Metrics and health on their own connector, because Prometheus runs in a container and
    # reaches the host by its gateway address rather than by loopback. Splitting the ports is what
    # lets the scrape keep working while the API above stops being reachable.
    #
    # This connector is still on every interface, and that is a knowing trade rather than an
    # oversight: what it serves is /actuator/health and /actuator/prometheus, both read-only, and
    # narrowing it to the Docker gateway would hard-code an address that differs on every machine.
    # It leaks operational shape - request rates, JVM internals, outbox depth - and moves nothing.
    #
    # It applies to this profile alone, which is the application run on the host for a load ramp.
    # Under the compose profile the port is not published at all, so nothing outside that network
    # can reach it.
    port: 8081
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      # Every request. This is a project that is measured, not a service paying for its own volume,
      # and a sampled-out trace is one that cannot be used to answer a question afterwards.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Tempo's OTLP/HTTP receiver, from the compose stack. Nothing listening here is not an
          # error the application should care about: spans are dropped, requests are still served.
          endpoint: http://127.0.0.1:4318/v1/traces
