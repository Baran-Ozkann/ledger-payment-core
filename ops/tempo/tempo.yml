# Single binary, local blocks, no object store. Traces here are read minutes after they are
# written, by one person looking at one request; anything durable would be pretending otherwise.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short, so a trace becomes searchable while the request that produced it is still interesting.
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
